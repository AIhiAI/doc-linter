[graph]
all-features = false

[output]
feature-depth = 1

[advisories]
yanked = "deny"
ignore = [
    # paste is unmaintained (not unsound); tokenizers, behind the
    # embeddings feature, still depends on it.
    { id = "RUSTSEC-2024-0436", reason = "transitive via tokenizers; no fix upstream" },
    # anymap2 is unmaintained (not unsound); liquid-core 0.26.11 (latest)
    # still depends on it, pulled in by tract-nnef behind tract-onnx.
    { id = "RUSTSEC-2026-0319", reason = "transitive via tract-nnef/liquid; no fix upstream" },
]

[licenses]
confidence-threshold = 0.8
# doc-linter itself is Apache-2.0, already on the allow list below.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots (Mozilla's CA list), via reqwest behind the `llm` feature.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
