# Copy to .github/workflows/doc-linter-gate.yml in your repo.
#
# Starts in WARN mode: the job reports lint errors but never fails the PR.
# To make it BLOCKING, delete the `continue-on-error: true` line on the
# "Lint docs" step. See docs/ci-gate.md.
name: doc-linter-gate

on:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # kuzu (the embedded graph DB) compiles C++ on first build.
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Cache doc-linter binary
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/doc-linter
          key: doc-linter-${{ runner.os }}-v0.3.1

      - name: Install doc-linter
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo install --locked --git https://github.com/AIhiAI/doc-linter

      # Optional: install the SCIP indexers for your languages first, then
      # uncomment, to include the code graph (see the README language table).
      # - name: Index code
      #   run: doc-linter scip-index

      - name: Lint docs
        # WARN mode. Remove this line to block merges on lint errors.
        continue-on-error: true
        # --no-vale skips Vale; drop it if Vale is installed on the runner.
        run: doc-linter check --no-vale
