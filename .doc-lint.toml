# doc-linter configuration. Generated by `doc-linter init`.
#
# Every `.md` file in this repo is walked by the linter, parsed for YAML
# frontmatter, and validated against the ontology in `docs/ontology/`.
# Edit this file to relax or tighten rules. All fields are optional —
# omitted fields fall back to the compiled-in defaults.
#
# Reference: <https://github.com/AIhiAI/doc-linter>

# Glob patterns (repo-relative) the walker considers. Default: every .md.
include = ["**/*.md"]

# Files explicitly excluded from validation. They're allowed to exist but
# the linter doesn't check their frontmatter or links. Use sparingly —
# every excluded file is a piece of the doc graph the linter can't see.
#
# CLAUDE.md / AGENTS.md are AI-agent prompt files with their own per-tool
# format conventions; they're excluded by default. Override below if you
# want them lint-checked anyway.
exempt = [
    "**/CLAUDE.md",               # Claude Code agent prompt
    "**/AGENTS.md",               # opencode / Cursor agent prompt
    # Examples — uncomment / extend for your repo:
    # "docs/archive/**",          # frozen exploration drafts
]

# Directories the walker never descends into.
#
# `templates/` holds the init-scaffold sources — identical copies of
# the files written into `docs/ontology/` when a user runs
# `doc-linter init`. Linting them would surface duplicate-id errors
# against the just-scaffolded copies in this same repo. They're vetted
# by snapshot tests under `tests/`, not by the corpus lint.
skip_dirs = ["target", ".git", ".obsidian", "node_modules", "templates", ".claude"]

# Inline backtick strings the linter should NOT flag as `unlinked-path`.
# Use this for filenames referenced as a convention (every workspace has
# one) rather than a single resolvable file.
unlinked_path_exempt = [
    # README/USAGE illustrate config and integration shapes — these
    # paths are templates / examples a downstream repo creates, not
    # files that should exist in this repo.
    ".claude/settings.json",
    ".cursor/mcp.json",
    ".doc-lint/ingest-cache.json",
    "src/foo.rs:42",
    "crates/doc-linter/AGENTS.md",
    # Referenced inside the generated `docs/error-codes.md` table.
    # The file is created at this path by `doc-linter init` in
    # downstream repos but doesn't exist here — the placeholder
    # entity was the first thing we deleted while bootstrapping.
    "docs/ontology/entities/example.md",
    # Example / downstream paths quoted from code doc comments into the
    # generated docs/reference/*.md (`doc-linter gen-docs`). Paths that
    # exist in this repo are turned into links by the generator.
    "docs/MAP.md",
    "docs/coverage-report.md",
    ".doc-lint/anchor-exempt.txt",
    "docs/design/foo.md",
    "frontend/src/routes/reset-password.tsx",
]

# `cli`, `mcp`, `config` repeat per folder (docs/reference/ for the
# generated references, docs/quickstart/ for the short guides), so their
# ids are prefixed (`reference-cli`, `quickstart-cli`) instead of
# matching the stem.
generic_stems = ["cli", "mcp", "config"]

# Sibling git repos to walk together with this one. Same lint rules apply
# to every doc under those trees, and wikilinks/md-links resolve across
# repo boundaries. Paths are repo-relative.
cross_repo_roots = []

# Frontmatter status vocabulary. `status:` is the editorial state of the
# doc itself (is the *prose* finished?), distinct from `lifecycle:` (the
# state of the *thing the doc describes*).
allowed_statuses = ["draft", "stable", "archived", "deprecated"]

# Frontmatter fields every (non-exempt) doc must have. `role:` is also
# ontology-validated against `docs/ontology/values/role/`.
required_fields = ["id", "role", "title", "summary", "status", "updated"]

# Allowed values for the optional `visibility:` field. Used by the
# `doc-linter export` publish pipeline to filter which docs leave a
# private monorepo. Omitted = `public` = always exported.
allowed_visibility = ["public", "internal", "private"]

# Vale glossary integration ("vocabulary closure"). When enabled, the
# linter regenerates a Vale config tree from your ontology and shells
# out to `vale` to check that every domain noun in doc bodies resolves
# to a registered ontology entity.
#
# Off by default — flip on once you have ontology entities authored AND
# the `vale` binary on PATH (https://vale.sh).
vale_enabled = true

# Bare ambiguous English nouns the Vale `Vocabulary.AmbiguousBare` rule
# flags. Authors must qualify these (e.g. "pricing rule" not "rule") so
# the term resolves to a single ontology entity.
#
# Trimmed for the self-host case: `rule` / `system` / `module` / `data`
# do not have repo-specific domain meanings here — `module` means Rust
# module, `rule` means lint rule, `system` is generic English. Keeping
# only `service` / `platform` / `engine` which can still be ambiguous
# in user-facing prose. Downstream domain repos should restore the full
# list.
vale_ambiguous_words = ["service", "platform", "engine"]

# Phase 2 vocab cleanup (see `src/config/vale.rs` — `vale_extra_accept`):
# tech terms / brand acronyms that should pass vocabulary closure without
# becoming ontology entities. The bar to stay on this list: the term has
# no domain meaning specific to doc-linter (it's a generic tool, vendor,
# or stdlib concept that the prose mentions but the ontology shouldn't
# enumerate). First-class concepts (MCP, SQL, Endpoint, SCIP, ONNX,
# Roadmap, …) belong in `docs/ontology/entities/`, not here.
vale_extra_accept = [
    # Vendors / models / corpora
    "HuggingFace",
    "Sourcegraph",
    "TensorFlow",
    "PyTorch",
    "NumPy",
    "JAX",
    "FastAPI",
    "CLA",
    "ICLA",
    "CCLA",
    "Xenova",
    # Editors / tools / runtimes
    "Neovim",
    "GCC",
    "JS",
    "TSX",
    "rust-analyzer",
    "Pinia",
    "Asciidoctor",
    "AsciiDoc",
    "OpenAI",
    # Acronyms — singular + plural. The vocab generator adds case
    # variants but doesn't pluralise singletons, so we list both forms
    # whenever the prose uses both.
    "PR",
    "PRs",
    "URL",
    "URLs",
    "ADR",
    "ADRs",
    "TODO",
    "TODOs",
    "FIXME",
    "TBD",
    "README",
    "READMEs",
    "FAQ",
    "FAQs",
    "ID",
    "IDs",
    "API",
    "SSE",
    "BM25",
    "PK",
    "EOF",
    "DDL",
    "DML",
    "RC",
    "AST",
    "BFS",
    "PID",
    "VCS",
    "ACI",   # agent-computer interface
    "GMN",   # graph matching network
    "GiB",
    "MiB",
    "KiB",
    # Convention names the prose uses verbatim.
    "PostToolUse",
    "Vocab",
    "Subcommand",
    "Lifecycle",  # ontology axis (axes don't auto-populate the vocab today)
    "Ontology",   # meta term — capitalised at sentence starts
    "Filename",
    "Lockfile",
    "NoOp",
    "FewshotExample",
    # Algorithm / scoring names.
    "Louvain",
    "LPA",
    "Okapi",
    "Levenshtein",
    "RepoCoder",
    # Sentence-start adjectives that vale's title-case rule
    # incorrectly flags as proper nouns.
    "Pre",
    "Curated",
    "Decoupled",
    "Agentic",
    # Storage / indexing terms
    "HNSW",
    "CTE",
    "CTEs",
    "SIMD",
    "Fineract",
    # The query language of the removed Kuzu store; appears in migration history
    "Cypher",
]

# Proper nouns (people / places / brands). Same plumbing as
# `vale_extra_accept`, separate for cleaner config reads.
proper_nouns = [
    "Anthropic",
    "Claude",
    "Procida",  # vale author Daniele Procida
    "Daniele",
]

# Round 3A: extract doc comments from source files and run them through
# the same vocab-closure rules as markdown docs. Off by default — turn
# on once you have ontology entities matching your codebase's vocabulary.
#
# Supported languages: Rust (`///` / `//!` / `/** */` doc comments),
# TypeScript / TSX (`/** */` JSDoc / TSDoc blocks), and Python
# (PEP-257 `"""docstring"""` blocks attached to module / function /
# class / async-def / decorated definitions). Extend `code_comment_includes`
# to scope which files participate.
lint_code_comments = false
code_comment_includes = ["**/*.rs", "**/*.py", "**/*.ts", "**/*.tsx"]
code_comment_excludes = ["target/**", "**/tests/**", "**/build.rs", "**/__pycache__/**"]

# When true, every public-API item that carries a doc comment must
# reference at least one ontology entity or `roadmap-…` doc id. Only
# applies to crates listed in `anchor_required_in`.
require_anchor_per_pubapi = false
anchor_required_in = []

# Round 3B: when true, `cmd_check` emits a `scip-missing` diagnostic if
# `<root>/.doc-lint/code.scip` doesn't exist. Default false — the SCIP
# file is opportunistic.
scip_required = false

# Endpoints whose handler the SCIP resolver can't disambiguate even
# with the same-file fallback. `clap:cli:check`'s handler is
# `pub(crate) fn run` in src/cmd/check/mod.rs — same-file filter
# should isolate it from the other 28 sibling `fn run`s but the
# resolver currently misses it (the other 28 resolve cleanly). Tracked
# as a follow-up; meanwhile a marked exemption keeps the lint
# actionable. Remove this entry once the resolver lands a fix.
coverage_endpoint_exempt = ["clap:cli:check"]

# Every handler here carries an `@endpoint` marker; skip the syntactic parsers.
endpoint_marker_exclusive = true

# Per-context path inference for the `bounded-context` axis. Keys are
# context ids; values are repo-relative path prefixes. A doc's effective
# context falls out of the longest matching prefix when no explicit
# `bounded_context:` frontmatter field is set.
#
# Example syntax (uncomment when you have contexts authored):
#
# [bounded_context_paths]
# pricing = ["crates/pricing-core", "crates/pricing-tenant"]
# sync    = ["crates/import-core"]
# docs    = ["crates/doc-linter", "docs/ontology"]

# Repo-wide fallback bounded context. `None` means "no implicit context".
# default_bounded_context = "platform"

# `unauthored-cluster` lint — LPA community detection over Function+CALLS
# during `check` flags every community whose `suggested_id` doesn't match
# any registered ontology entity. The compiled-in defaults already skip
# generic fall-through buckets (`common`, `util`, `mod`, `tests`, ...);
# we re-list them here so the per-repo extension is one obvious block.
#
# doc-linter is its own first downstream consumer, so the code graph
# clusters around the crate's internal features — `cluster` (community
# detection), `coverage` (code↔doc reachability), `symbols` (SCIP
# tokenization), `promote` (candidate-stub workflow), `disambiguation`
# (Vale post-processor), `query` (CLI subcommand). These are tooling
# pipelines, not domain entities; every doc-linter feature would
# otherwise demand its own stub. The two entities the project does
# carry — `doc-graph` and `lsp` — describe the unifying data model
# and the editor surface respectively, not these per-module concerns.
[cluster_lint]
ignore = [
    # Compiled-in defaults, re-asserted so this list is self-contained.
    "common",
    "util",
    "utils",
    "mod",
    "tests",
    "test",
    "main",
    "lib",
    # Self-host: doc-linter's own internal feature modules. Each is a
    # tooling pipeline, not a domain concept worth an ontology entry.
    # `symbols` was here too but moved to `entity-scip.synonyms` since
    # SCIP symbol tokenization is properly a sub-concept of the SCIP
    # entity, not its own domain.
    "cluster",          # src/cmd/cluster.rs — LPA community detection
    "coverage",         # src/coverage.rs — code↔doc reachability report
    "promote",          # src/promote.rs — candidate-stub promotion workflow
    "disambiguation",   # src/disambiguation.rs — Vale alert post-processor
    "query",            # src/query.rs — `doc-linter query` subcommand surface
]
