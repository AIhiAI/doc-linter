name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy, rust-analyzer

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: test
        run: cargo test --release

      # Self-host: lint doc-linter's own docs with the binary the tests
      # just built, so linter regressions show up here before they reach
      # adopting repos. Reusing this job's build avoids a second cold
      # build (a separate job ran out of time building).
      - name: Index doc-linter's own code (SCIP)
        # dark-endpoint follows each CLI handler's FUNCTION_MENTIONS,
        # which only exist with a code graph: without it every
        # subcommand reads as dark. rust-analyzer needs more than the
        # default 4 GiB address-space cap on this crate.
        env:
          DOC_LINTER_SCIP_MEMORY_MB: "8192"
        run: ./target/release/doc-linter scip-index

      - name: Lint doc-linter's own corpus
        # Vale isn't installed on the runner.
        run: ./target/release/doc-linter check --no-vale

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # `cargo install` reads rust-toolchain.toml, so the pinned 1.88.0
      # has to be available — otherwise the install step errors before
      # doing anything.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  machete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: llvm-tools-preview

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run coverage (HTML + lcov)
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --release --lcov --output-path target/llvm-cov/coverage.lcov
          cargo llvm-cov report --release --html --output-dir target/llvm-cov/html

      - name: Coverage summary
        run: cargo llvm-cov report --release --summary-only

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/llvm-cov/coverage.lcov
          retention-days: 14
