# Built-in doc-linter STE style (ASD-STE100 writing rules, no dictionary).
# Adapted from Syntaf/vale-llm-slop (MIT, (c) 2026 Grant Mercer); see NOTICE.
# Turn on with `vale_styles = ["STE"]` in .doc-lint.toml.
# STE: a procedure step has 20 words or fewer. Vale cannot tell a
# procedure from a description, so a list item counts as a step.
extends: occurrence
message: "STE: the list item has %d words. Use 20 words or fewer in a step."
level: warning
scope: list
max: 20
token: '[\w''’-]+'
